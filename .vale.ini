StylesPath = .vale-styles
MinAlertLevel = warning

Packages = Microsoft

# The project vocabulary carries words Vale.Spelling does not know
# (SQLAlchemy, subcommand, nullable and so on). It lives at
# .vale-styles/config/vocabularies/Previously/accept.txt, which is why
# .gitignore excludes only .vale-styles/Microsoft/ and not the whole tree:
# the downloaded package is disposable, the vocabulary is not.
#
# One property of it surprises everyone once, so it is written down here.
# Vale.Terms pins the exact spelling of **every** entry, not just of entries
# that appear twice in different casings. Measured with one casing per entry:
# ten errors, among them "Use 'Nullable' instead of 'nullable'" and
# "Use 'Canonicalization' instead of 'canonicalization'". Fifteen of the
# twenty entries are lowercase, so those fifteen words cannot begin a
# sentence or a heading anywhere in this tree. The number is worth recounting
# rather than carrying forward: it read "nine of the eleven" until task 6
# counted the file with `awk 'NF && /^[a-z]/'` and got ten out of eleven,
# before adding Hetzner, Ceph, Dalibo and namespace; stage 1c added
# redactions, counted the same way on 2026-10-04, and ciphertext, ciphertexts
# and plaintext for the blobs page, counted the same way on 2026-10-05; Mailu,
# the mail server of the pilot, came on 2026-10-06 and is capitalized, so the
# count of lowercase entries stayed at fifteen, counted the same way.
# Nothing trips over it today -- the canonicalization page is called "About
# canonicalization" rather than "Canonicalization", which is why.
#
# If it ever does trip: reword, or switch Vale.Terms off for the one path
# that needs it. Do **not** add the capitalised form as a second entry --
# that merely reverses the constraint, and then lowercase in prose becomes
# the error instead.
Vocab = Previously

[*.md]
BasedOnStyles = Vale, Microsoft

# Microsoft style avoids first-person plural ("we", "let's"); the
# plone-doc-style skill's Tutorial quadrant (section 2a) requires it
# ("First-person plural: 'We will create…', 'Let's check…'"). The two
# disagree, and for this project the skill wins — but only in the one
# quadrant it actually governs that language pattern for. Scoped to
# docs/tutorials/ so the rule still catches "we"/"our"/"let's" everywhere
# else (how-to, reference, explanation), where Microsoft style stands
# unopposed.
[docs/tutorials/*.md]
Microsoft.We = NO
