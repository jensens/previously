[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "previously"
dynamic = ["version"]
description = "An append-only knowledge store for project histories"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "boto3>=1.43",
    "pyrage>=1.4",
    "html2text>=2025.4",
    "anthropic>=1.13.0",
    "openai>=3.27.0",
    "pydantic>=2.14",
]

[project.scripts]
previously = "previously.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-randomly>=5.0",
    "coverage[toml]>=7.16",
    "testcontainers[postgres]>=4.15",
    "hypothesis>=6.168",
]
dev = [
    "ruff>=0.16",
    "pyright>=1.1.414",
    "import-linter>=2.15",
    "pre-commit>=4.6",
    "pip-audit>=2.10.1",
    "pyrage-stubs>=1.4",
    "types-boto3-lite[s3]>=1.43",
    "hatchling>=1.32",
    "hatch-vcs>=0.5",
]
docs = [
    "sphinx>=9.1",
    "myst-parser>=5.1",
    "sphinx-book-theme>=1.4",
    "sphinx-design>=0.7",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.1",
    "vale>=3.22",
    # Not in the brief: conf.py's myst_enable_extensions turns on "linkify",
    # and markdown-it-py's linkify rule raises ModuleNotFoundError without
    # its counterpart installed. Measured by running `make -C docs html`.
    "linkify-it-py>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/previously"]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.ruff]
target-version = "py314"
line-length = 100
# docs/ holds the specification and the plans, not source code. ruff>=0.16
# formats Python code blocks inside Markdown by default — there, those blocks
# are illustrative fragments rather than project code, hence the exclusion.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["A", "B", "C4", "C901", "DTZ", "E", "F", "I", "RUF", "S", "SIM", "T20", "TC", "TID", "UP", "W"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# The import style used across this maintainer's other projects. Consistency
# between the projects is the reason; the settings are not argued from this
# codebase.
#
# `no-sections` is the one with a price here, and it is worth knowing about:
# standard library, third-party and `previously.*` imports end up in a single
# alphabetical list, so a module no longer shows at a glance which layer it
# depends on — in a project whose central property is the separation of
# `cli` → `core` | `migrations` → `storage` → `contract`, where `core` and
# `migrations` share a layer and import nothing from each other. That
# separation is enforced mechanically by import-linter (see `.importlinter`),
# so this costs readability at that one spot and nothing else.
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
no-sections = true
order-by-type = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
# Printing to stdout is what this module is for — a `# noqa: T201` on each of
# the fifty-one `print` calls would be the same justification repeated
# fifty-one times (ruling T9-c of the stage 1a execution, whose ledger is
# lost, so the label resolves nowhere). The count is measured against this
# configuration with every per-file ignore emptied out, `ruff check --select
# T201 --config 'lint.per-file-ignores = {}' src/previously/cli.py` — that
# also drops the `tests/*` line above, which costs nothing here, since the
# command names one file under `src/`. The count has been wrong twice: it read
# nine against thirteen, which was a miscount and not a drift, and then
# thirteen until stage 1b's three commands took it to nineteen on 2026-10-04.
# The same day `anchor` and the anchor check in `verify` took it to
# twenty-four, and `redact` took it to twenty-six in stage 1c, measured with
# the command above on 2026-10-04. On 2026-10-05 `redact` naming a rebuild
# its catch-up ran took it to twenty-seven, measured the same way, and
# `show` printing the blobs of an event and `blob get` took it to thirty.
# `blob get` saying a blob is erased and `redact` naming a blob that stays in
# the store took it to thirty-two on 2026-10-05, measured the same way.
# `redact units` saying that the payload stays took it to thirty-three the
# same day, measured the same way, and `migrate` took it to thirty-four.
# `ingest imap` took it to thirty-six on 2026-10-06, measured the same way:
# its line on standard output and one notice per variant. `policy` took it to
# forty on 2026-10-09, measured the same way: the structured form, the notice
# that nothing was written, the event id and the lines of `policy show`.
# `gate` and `policy gaps` took it to forty-nine on 2026-10-09, measured the
# same way: the lines and the notice of `policy gaps`, the lines and the
# fallback of `gate explain`, and the fallback, the output, the event id, the
# alarm and the failure of `gate try`. `redact` naming each `model_call` its
# cascade erased took it to fifty the same day, which the count missed until
# the final review measured it, and `gate try` saying that the input was
# erased while the call ran took it to fifty-one, measured the same way.
"src/previously/cli.py" = ["T201"]

[tool.ruff.lint.flake8-type-checking]
# The members of `contract/types.py` are dataclasses: their annotations are
# evaluated at runtime as soon as anything applies `typing.get_type_hints()`
# to them — and that is precisely what the connector contract exists for. A
# TYPE_CHECKING block would break that with a NameError, so the imports there
# are real imports.
runtime-evaluated-decorators = ["dataclasses.dataclass"]
# The counterpart for pydantic, whose first `BaseModel` arrived with the gate on
# 2026-10-09, as the output schema of a task. Without this entry ruff moves the
# `BaseModel` imports under `TYPE_CHECKING`, and pydantic then fails at
# runtime, because it resolves the annotations of a model while the class is
# being built (ruling T2-e of the stage 1a execution, whose ledger is lost, so
# the label resolves nowhere and this sentence is the reason).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pyright]
# The migrations are not an accessory: `versions/0001_log.py` creates the
# schema and `dsn.py` carries the DSN resolution — both real logic, which
# slipped past the strict check unnoticed while the migrations sat outside
# `src` without an entry of their own here, until the fix round that added
# one. They live under `src/previously/migrations/` now, so `src` covers them.
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs PostgreSQL (testcontainer)",
    "s3: needs an S3 server (testcontainer)",
    "imap: needs an IMAP server (testcontainer)",
]

[tool.coverage.run]
# A path, not the package name. By name, coverage attributes executed code by
# module name, and Alembic loads `migrations/env.py` and every revision with
# `load_python_file` under module names of its own: measured on 2026-10-05,
# `env.py` read 0% although every test session runs it, and the revisions
# were missing from the report altogether. By path, both are measured.
source = ["src/previously"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
